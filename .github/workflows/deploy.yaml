name: Build and Deploy Quartz site to GitHub Pages
on:
  push:
    branches:
      - v5
permissions:
  contents: write
jobs:
  build-deploy:
    concurrency: ci-${{ github.ref }} # Recommended if you intend to make multiple deployments in quick succession.
    runs-on: ubuntu-latest
    name: Deploy Github Pages with Quartz v5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          experimental: true
        run: mise run build_deploy
      - name: Deploy site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
