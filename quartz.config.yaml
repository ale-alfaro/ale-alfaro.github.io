#yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
    pageTitle: Byte Talk
    pageTitleSuffix: ""
    enableSPA: true
    enablePopovers: true
    analytics:
        provider: plausible
    locale: en-US
    baseUrl: ale-alfaro.github.io
    ignorePatterns:
        - private
        - templates
        - .obsidian
    theme:
        fontOrigin: googleFonts
        cdnCaching: true
        typography:
            header: Schibsted Grotesk
            body: Fira Sans
            code: Fira Code
        colors:
            lightMode:
                light: "#fdf6e3"
                lightgray: "#e0dcc7"
                gray: "#939b8a"
                darkgray: "#5c6a72"
                dark: "#3a464c"
                secondary: "#3a94c5"
                tertiary: "#8da101"
                highlight: rgba(160, 192, 128, 0.15)
                textHighlight: "#dbbc7f88"
            darkMode:
                light: "#2d353b"
                lightgray: "#475258"
                gray: "#859289"
                darkgray: "#d3c6aa"
                dark: "#e6dfc6"
                secondary: "#7fbbb3"
                tertiary: "#83c092"
                highlight: rgba(127, 187, 179, 0.15)
                textHighlight: "#dbbc7f88"
plugins:
    - source: github:quartz-community/created-modified-date
      enabled: true
      options:
          defaultDateType: modified
          priority:
              - frontmatter
              - git
              - filesystem
      order: 10
    - source: github:quartz-community/syntax-highlighting
      enabled: true
      options:
          theme:
              light: github-light
              dark: github-dark
          keepBackground: false
      order: 20
    - source: github:ale-alfaro/obsidian-flavored-markdown#fix/wikilink-resolution-and-publish-filter
      enabled: true
      options:
          comments: true
          highlight: true
          wikilinks: true
          callouts: true
          mermaid: true
          parseTags: true
          parseArrows: true
          parseBlockReferences: true
          enableInHtmlEmbed: false
          enableYouTubeEmbed: true
          enableVideoEmbed: true
          enableCheckbox: true
          disableBrokenWikilinks: true
          publishFilter:
              - key: publish
                condition: must-be-true
      order: 30
    - source: github:quartz-community/github-flavored-markdown
      enabled: true
      order: 40
    - source: github:quartz-community/table-of-contents
      enabled: true
      order: 50
    - source: github:quartz-community/crawl-links
      enabled: true
      options:
          markdownLinkResolution: shortest
          prettyLinks: true
          externalLinkIcon: true
      order: 60
    - source: github:quartz-community/description
      enabled: true
      order: 70
    - source: github:quartz-community/explicit-publish
      enabled: true
    - source: github:quartz-community/content-index
      enabled: true
      options:
          enableSiteMap: true
          enableRSS: true
    - source: github:quartz-community/favicon
      enabled: true
    - source: github:quartz-community/og-image
      enabled: true
    - source: github:quartz-community/cname
      enabled: true
    - source: github:quartz-community/canvas-page
      enabled: true
    - source: github:quartz-community/content-page
      enabled: true
    - source: github:quartz-community/folder-page
      enabled: true
    - source: github:quartz-community/explorer
      enabled: true
      layout:
          position: left
          priority: 50
    - source: github:quartz-community/search
      enabled: true
      layout:
          position: left
          priority: 20
          group: toolbar
          groupOptions:
              grow: true
    - source: github:quartz-community/backlinks
      enabled: true
      layout:
          position: right
          priority: 30
    - source: github:quartz-community/article-title
      enabled: true
      layout:
          position: beforeBody
          priority: 10
    - source: github:quartz-community/content-meta
      enabled: true
      layout:
          position: beforeBody
          priority: 20
    - source: github:quartz-community/page-title
      enabled: true
      layout:
          position: left
          priority: 10
    - source: github:quartz-community/darkmode
      enabled: true
      layout:
          position: left
          priority: 30
          group: toolbar
    - source: github:quartz-community/reader-mode
      enabled: true
      layout:
          position: left
          priority: 35
          group: toolbar
    - source: github:quartz-community/breadcrumbs
      enabled: true
      layout:
          position: beforeBody
          priority: 5
          condition: not-index
    - source: github:quartz-community/footer
      enabled: true
      options:
          links:
              GitHub @ale-alfaro: https://github.com/ale-alfaro
    - source: github:quartz-community/spacer
      enabled: true
      options: {}
      order: 25
      layout:
          position: left
          priority: 25
          display: mobile-only
    - source: github:quartz-community/note-properties
      enabled: true
      options:
          includeAll: false
          includedProperties:
              - description
              - created
              - modified
          excludedProperties: []
          hidePropertiesView: true
          delimiters: ---
          language: yaml
      order: 5
      layout:
          position: beforeBody
          priority: 15
          display: all
layout:
    groups:
        toolbar:
            priority: 35
            direction: row
            gap: 0.5rem
    byPageType:
        "404":
            positions:
                beforeBody: []
                left: []
                right: []
        content: {}
        folder:
            exclude:
                - reader-mode
            positions:
                right: []
        tag:
            exclude:
                - reader-mode
            positions:
                right: []
