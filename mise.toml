[hooks]
cd = 'mise i -q'

[shell_alias]
quartz = './quartz/bootstrap-cli.mjs'

[tools]
bun = "latest"
dprint = "latest"
hk = "latest"
pkl = "latest"
prettier = "latest"

[tasks.install]
description = "Install bun dependencies"
run = ['bun install', 'bun run install-plugins']

[tasks.sync]
description = "Sync with Quartz"
depends = ["install"]
run = ['bun quartz sync -d blog -v']

[tasks.commit]
description = "Commit and Sync with Quartz"
depends = ["install"]
run = ['bun quartz sync -d blog -v --commit']

[tasks.build_deploy]
description = "Build and deploy in CI"
depends = ["install"]
outputs = 'public/**'
hide = true
run = ['bun quartz build -d blog -v --bundleInfo']

[tasks.build_local]
description = "Build and deploy over localhost"
alias = "build"
outputs = 'public/**'
run = ['bun quartz build -d blog --serve -v']

[env]
HK_MISE = "1"
HK_SUMMARY_TEXT = "1"
