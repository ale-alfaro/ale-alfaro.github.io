[settings]
npm.package_manager = 'npm'
npm.bun = false

[hooks]
cd = 'mise i -q'

[shell_alias]
quartz = 'npx quartz'

[tools]
node = "lts"
dprint = "latest"
hk = "latest"
pkl = "latest"

[deps.npm]
auto = true

[deps.plugins]
auto = true
description = "Install Quartz plugins"
depends = ["npm"]
sources = ["quartz.config.yaml", "quartz.lock.json"]
outputs = [".quartz/plugins"]
run = "npm run install-plugins"

[tasks.sync]
description = "Sync with Quartz"
dir = '{{config_root}}'
env = { OBSIDIAN_BLOG_HOME = { required = true } }
confirm = "Are you sure you want to `rsync {{env.OBSIDIAN_BLOG_HOME}}/blog/ {{config_root}}/blog/` and run `npx quartz sync -d {{config_root}}/blog -v`"
run = [
    'mise run obsidian:vault:rsync "${OBSIDIAN_BLOG_HOME?}/blog" --no-dry-run',
    'npx quartz sync -d blog -v',
]

[tasks.build_deploy]
description = "Build and deploy in CI"
hide = true
run = ['npx quartz build -d blog -v --bundleInfo']

[tasks.build_local]
description = "Build and deploy over localhost"
alias = "build"
run = ['npx quartz build -d blog --serve -v']

[env]
HK_MISE = "1"
HK_SUMMARY_TEXT = "1"
