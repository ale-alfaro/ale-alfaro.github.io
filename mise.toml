
[tools]
bun = "latest"
prek = "latest"

[tasks.install_deps]
description = "Install dependencies and plugins"
run = """
mise install
bun install
bun quartz plugin install
"""

[tasks.sync]
description = "Sync with Quartz"
depends = ["install_deps"]
run = ['bun quartz sync -d blog -v']

[tasks.build_deploy]
description = "Build and deploy in CI"
depends = ["install_deps"]
run = ['bun quartz build -d blog -v --bundleInfo']

[tasks.build_local]
description = "Build and deploy over localhost"
alias = "build"
depends = ["install_deps"]
run = ['bun quartz build -d blog --serve']
