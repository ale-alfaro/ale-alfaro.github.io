[hooks]
cd = 'mise i -q'

[shell_alias]
quartz = 'npx quartz'

[tools]
node = "lts"
dprint = "latest"
hk = "latest"
pkl = "latest"
prettier = "latest"

[deps.npm]
auto = true

[deps.plugins]
auto = true
description = "Install Quartz plugins"
depends = ["npm"]
sources = ["quartz.config.yaml", "quartz.lock.json"]
outputs = [".quartz/plugins"]
run = "npm run install-plugins"

[tasks.sync]
description = "Sync with Quartz"
run = ['npx quartz sync -d blog -v']

[tasks.commit]
description = "Commit and Sync with Quartz"
run = ['npx quartz sync -d blog -v --commit']

[tasks.build_deploy]
description = "Build and deploy in CI"
outputs = 'public/**'
hide = true
run = ['npx quartz build -d blog -v --bundleInfo']

[tasks.build_local]
description = "Build and deploy over localhost"
alias = "build"
outputs = 'public/**'
run = ['npx quartz build -d blog --serve -v']

[env]
HK_MISE = "1"
HK_SUMMARY_TEXT = "1"
